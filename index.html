<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>School Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--plum:#462D5B;--plum-2:#6A4B85;--plum-soft:#EDE6F5;--sage:#5E8455;--sage-soft:#E6EFE2;--amber:#A86C12;--amber-soft:#FBF0DC;--red:#B4473A;--red-soft:#F8E4E1;--bg:#F7F4FB;--card:#FFFFFF;--ink:#2E2140;--muted:#6F6680;--line:#E4DDEE;color-scheme:light}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--plum:#CDB9EA;--plum-2:#DCCCF2;--plum-soft:#352A45;--sage:#A7C59A;--sage-soft:#26331F;--amber:#E6B566;--amber-soft:#3A2E17;--red:#E8897C;--red-soft:#3D2220;--bg:#17131D;--card:#221C2B;--ink:#F1ECF7;--muted:#B2A8C2;--line:#382F45;color-scheme:dark}}
*{box-sizing:border-box}html,body{margin:0}
body{font-family:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink);font-size:16px;line-height:1.55;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--plum-2);outline-offset:2px}
h1,h2,h3,.btn,.brand{font-family:"Poppins","Nunito",system-ui,sans-serif}
header{display:flex;align-items:center;gap:12px;padding:12px 20px;background:var(--card);border-bottom:1px solid var(--line);flex-wrap:wrap}
.brand{font-weight:600;font-size:22px;color:var(--plum);text-decoration:none}
header .who{margin-left:auto;display:flex;gap:10px;align-items:center;font-size:14px;color:var(--muted);flex-wrap:wrap}
main{max-width:1100px;margin:0 auto;padding:24px 20px 48px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px 24px;margin-bottom:18px}
.card h2{margin:0 0 8px;font-size:20px;color:var(--plum);font-weight:600}
.narrow{max-width:440px;margin:24px auto}
label{display:block;font-weight:700;font-size:14px;margin:12px 0 4px}
input[type=text],input[type=email],input[type=password]{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px}
.btn{border:0;background:var(--plum);color:#fff;border-radius:999px;padding:10px 20px;font-weight:600;cursor:pointer;text-decoration:none;display:inline-block}
.btn.ghost{background:var(--bg);color:var(--plum);border:1px solid var(--line)}
.btn.small{padding:6px 12px;font-size:13px}
.btn:disabled{opacity:.5;cursor:wait}
.full{width:100%;margin-top:16px}
.tabs{display:flex;gap:6px;margin-bottom:6px}
.tabs button{flex:1;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:8px;font-weight:700;cursor:pointer}
.tabs button[aria-pressed="true"]{background:var(--plum);color:#fff;border-color:var(--plum)}
.link{background:none;border:0;color:var(--plum);font-weight:700;cursor:pointer;padding:0;text-decoration:underline}
.msg{border-radius:12px;padding:10px 14px;margin-top:12px;font-weight:600;font-size:14px}
.msg.err{background:var(--red-soft);color:var(--red)}.msg.ok{background:var(--sage-soft);color:var(--sage)}
.note{color:var(--muted);font-size:14px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;display:flex;flex-direction:column;gap:6px}
.tile h3{margin:0;font-size:18px;color:var(--plum);font-weight:600}
.tile p{margin:0 0 10px;color:var(--muted);font-size:14px;flex:1}
.tile.soon{opacity:.75}
.badge{display:inline-block;font-size:12.5px;font-weight:800;padding:3px 10px;border-radius:999px;align-self:flex-start}
.b-pending{background:var(--amber-soft);color:var(--amber)}.b-approved{background:var(--sage-soft);color:var(--sage)}.b-suspended{background:var(--red-soft);color:var(--red)}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%}
th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);font-size:14px;vertical-align:top}
th{color:var(--muted);font-size:13px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.mods{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:14px}
.mods label{display:flex;align-items:center;gap:6px;margin:0;font-weight:600}
.ptitle{margin:0 0 4px;font-weight:600;font-size:26px}
.hero{text-align:center;padding:40px 0 24px}
.hero h1{font-size:clamp(28px,4vw,44px);line-height:1.2;margin:0 0 14px;color:var(--plum);font-weight:600}
.hero p{max-width:640px;margin:0 auto 22px;color:var(--muted);font-size:17px}
.hero .row{justify-content:center}
body.auth header{display:none}
</style>
</head>
<body>
<header><a class="brand" href="#" id="brand">School Hub</a><div class="who" id="who"></div></header>
<main id="app"><p class="note">Loading…</p></main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
/* Change this one line when the platform has its name */
const PLATFORM = "School Hub";

const SUPABASE_URL = "https://oivsizxgekpiltrmrmqh.supabase.co";
const SUPABASE_KEY = "sb_publishable_5cHJA5XXHwRe-YyTeo-deA_-3xZS5DP";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

/* The modules on the platform. "url" is set once a module is ready to open. */
const MODULES = [
  { id: "twignest",  name: "TwigNest",       desc: "Student data, attainment, progress, next steps and reports.", url: "https://twignest-app.github.io/?intro" },
  { id: "grownest",  name: "GrowNest",       desc: "Lesson observations and teacher growth." },
  { id: "planning",  name: "Planning",       desc: "Curriculum coverage, unit planning and collaborative planning." },
  { id: "inclusion", name: "Inclusion",      desc: "Tracking support and provision for every learner." },
  { id: "wellbeing", name: "Wellbeing",      desc: "Regular wellbeing check-ins for students." },
  { id: "evidence",  name: "Evidence packs", desc: "Inspection evidence gathered from across the platform." }
];
const ROLES = { admin: "Admin", school_lead: "School leader", coordinator: "Coordinator", teacher: "Teacher", checker: "Buddy checker" };

const app = document.getElementById("app"), who = document.getElementById("who");
const esc = t => String(t ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const here = location.origin + location.pathname;
let authTab = "landing", recovering = false;
document.title = PLATFORM;
document.getElementById("brand").textContent = PLATFORM;
document.getElementById("brand").onclick = e => { e.preventDefault(); render(); };

function friendly(e){
  const m = (e && (e.message || e.error_description)) || String(e);
  if (/Invalid login/i.test(m)) return "The email or password is not correct.";
  if (/Email not confirmed/i.test(m)) return "Please confirm your email first. Check your inbox for the confirmation link.";
  if (/already registered/i.test(m)) return "An account with this email already exists. Try signing in instead.";
  if (/Password should be/i.test(m)) return "The password needs at least 8 characters.";
  if (/rate limit/i.test(m)) return "Too many attempts. Please wait a few minutes and try again.";
  return m;
}
function show(el, text, kind){ el.innerHTML = text ? `<div class="msg ${kind}">${esc(text)}</div>` : ""; }
async function busy(btn, fn){ btn.disabled = true; try { await fn(); } finally { btn.disabled = false; } }

function landingView(){
  document.body.classList.add("auth");
  app.innerHTML = `<section class="hero">
      <h1>One place for your school’s teaching and learning</h1>
      <p>Student progress, lesson observations, planning, inclusion, wellbeing and inspection evidence, all built on one shared school setup. Enter your school once, and every part uses it.</p>
      <div class="row"><button class="btn" data-auth="signup">Register your school</button><button class="btn ghost" data-auth="signin">Sign in</button></div>
    </section>
    <div class="tiles">${MODULES.map(m => `<div class="tile"><h3>${esc(m.name)}</h3><p>${esc(m.desc)}</p></div>`).join("")}</div>`;
  app.querySelectorAll("[data-auth]").forEach(b => b.onclick = () => { authTab = b.dataset.auth; authView(); window.scrollTo(0, 0); });
}

function authView(){
  if (authTab === "landing") return landingView();
  document.body.classList.add("auth");
  who.innerHTML = "";
  app.innerHTML = `<div class="narrow">
    <h1 class="ptitle" style="text-align:center;color:var(--plum)">${esc(PLATFORM)}</h1>
    <div class="card">
      ${authTab !== "forgot" ? `<div class="tabs" role="group" aria-label="Account">
        <button data-tab="signin" aria-pressed="${authTab === "signin"}">Sign in</button>
        <button data-tab="signup" aria-pressed="${authTab === "signup"}">Create account</button></div>` : `<h2>Reset your password</h2>`}
      <form id="authForm">
        ${authTab === "signup" ? `<label for="name">Full name</label><input id="name" type="text" autocomplete="name" required>` : ""}
        <label for="email">Email</label><input id="email" type="email" autocomplete="email" required>
        ${authTab !== "forgot" ? `<label for="pw">Password</label><input id="pw" type="password" minlength="8" autocomplete="${authTab === "signup" ? "new-password" : "current-password"}" required>` : ""}
        <button class="btn full" id="authBtn" type="submit">${authTab === "signin" ? "Sign in" : authTab === "signup" ? "Create account" : "Send reset link"}</button>
      </form>
      ${authTab === "signin" ? `<p class="note" style="margin-top:12px"><button class="link" data-tab="forgot">Forgot your password?</button></p>` : ""}
      ${authTab === "forgot" ? `<p class="note" style="margin-top:12px"><button class="link" data-tab="signin">Back to sign in</button></p>` : ""}
      <p class="note" style="margin-top:12px;text-align:center"><button class="link" data-tab="landing">← Back to the home page</button></p>
      <div id="authMsg"></div>
    </div></div>`;
  document.querySelectorAll("[data-tab]").forEach(b => b.onclick = () => { authTab = b.dataset.tab; authView(); });
  document.getElementById("authForm").onsubmit = e => { e.preventDefault();
    const btn = document.getElementById("authBtn"), msg = document.getElementById("authMsg");
    busy(btn, async () => {
      const email = document.getElementById("email").value.trim();
      if (authTab === "signin") {
        const { error } = await sb.auth.signInWithPassword({ email, password: document.getElementById("pw").value });
        if (error) return show(msg, friendly(error), "err");
      } else if (authTab === "signup") {
        const { error } = await sb.auth.signUp({ email, password: document.getElementById("pw").value,
          options: { data: { full_name: document.getElementById("name").value.trim() }, emailRedirectTo: here } });
        if (error) return show(msg, friendly(error), "err");
        show(msg, "Account created. Check your email and tap the confirmation link, then sign in here.", "ok");
      } else {
        const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: here });
        if (error) return show(msg, friendly(error), "err");
        show(msg, "If this email has an account, a reset link is on its way.", "ok");
      }
    }); };
}

function resetView(){
  document.body.classList.add("auth");
  app.innerHTML = `<div class="narrow card"><h2>Choose a new password</h2>
    <form id="rf"><label for="np">New password</label><input id="np" type="password" minlength="8" autocomplete="new-password" required>
    <button class="btn full" id="rb" type="submit">Save new password</button></form><div id="rm"></div></div>`;
  document.getElementById("rf").onsubmit = e => { e.preventDefault(); const btn = document.getElementById("rb");
    busy(btn, async () => { const { error } = await sb.auth.updateUser({ password: document.getElementById("np").value });
      if (error) return show(document.getElementById("rm"), friendly(error), "err");
      recovering = false; render(); }); };
}

function header(p){
  document.body.classList.remove("auth");
  who.innerHTML = `<span>${esc(p.full_name || p.email)} · ${p.platform_admin ? "Platform admin" : esc(ROLES[p.role] || "")}</span><button class="btn ghost small" id="out">Sign out</button>`;
  document.getElementById("out").onclick = async () => { await sb.auth.signOut(); authTab = "landing"; render(); };
}

function chooseView(p){
  app.innerHTML = `<div class="card"><h2>Welcome, ${esc((p.full_name || "").split(" ")[0])}</h2>
    <p class="note">Is your school new here, or has your school already joined?</p></div>
    <div class="grid2">
      <div class="card"><h2>Register my school</h2><p class="note">For school leaders. We’ll review and approve your school, then you can invite your teachers.</p>
        <form id="regF"><label for="sn">School name</label><input id="sn" type="text" required>
        <label for="sc">Country</label><input id="sc" type="text" value="United Arab Emirates" required>
        <button class="btn full" id="regB" type="submit">Register school</button></form><div id="regM"></div></div>
      <div class="card"><h2>Join my school</h2><p class="note">For teachers. Ask your school leader for your school’s 6-character code.</p>
        <form id="joinF"><label for="jc">School code</label><input id="jc" type="text" maxlength="6" style="text-transform:uppercase;letter-spacing:.15em" required>
        <button class="btn full" id="joinB" type="submit">Join school</button></form><div id="joinM"></div></div>
    </div>`;
  document.getElementById("regF").onsubmit = e => { e.preventDefault(); busy(document.getElementById("regB"), async () => {
    const { error } = await sb.rpc("register_school", { p_name: document.getElementById("sn").value, p_country: document.getElementById("sc").value });
    if (error) return show(document.getElementById("regM"), friendly(error), "err"); render(); }); };
  document.getElementById("joinF").onsubmit = e => { e.preventDefault(); busy(document.getElementById("joinB"), async () => {
    const { error } = await sb.rpc("join_school", { p_code: document.getElementById("jc").value });
    if (error) return show(document.getElementById("joinM"), friendly(error), "err"); render(); }); };
}

function waitView(title, text){
  app.innerHTML = `<div class="narrow card" style="text-align:center"><h2>${esc(title)}</h2><p class="note">${esc(text)}</p>
    <button class="btn ghost" id="chk">Check again</button></div>`;
  document.getElementById("chk").onclick = render;
}

function homeView(p, school){
  const on = school.modules || [];
  const mine = MODULES.filter(m => on.includes(m.id));
  const first = (p.full_name || "").split(" ")[0], hr = new Date().getHours();
  const greet = hr < 12 ? "Good morning" : hr < 17 ? "Good afternoon" : "Good evening";
  app.innerHTML = `<h1 class="ptitle">${greet}, ${esc(first)}</h1><p class="note" style="margin:0 0 20px">${esc(school.name)}</p>
    ${mine.length ? `<div class="tiles">${mine.map(m => m.url
      ? `<div class="tile"><h3>${esc(m.name)}</h3><p>${esc(m.desc)}</p><a class="btn" href="${esc(m.url)}">Open ${esc(m.name)}</a></div>`
      : `<div class="tile soon"><h3>${esc(m.name)}</h3><p>${esc(m.desc)}</p><span class="badge b-pending">Coming soon</span></div>`).join("")}</div>`
      : `<div class="card"><p class="note">No modules are switched on for your school yet.</p></div>`}`;
}

async function adminView(){
  app.innerHTML = `<h1 class="ptitle">Schools</h1><p class="note" style="margin:0 0 20px">Approve schools and choose which modules each one can use.</p>
    <div class="card"><div id="schools" class="tablewrap"><p class="note">Loading…</p></div></div>`;
  const box = document.getElementById("schools");
  const { data: schools, error } = await sb.from("schools").select("*").order("created_at", { ascending: false });
  if (error) return show(box, friendly(error), "err");
  if (!schools.length) { box.innerHTML = `<p class="note">No schools have registered yet.</p>`; return; }
  const ids = [...new Set(schools.map(s => s.created_by).filter(Boolean))];
  const { data: people } = ids.length ? await sb.from("profiles").select("id,full_name,email").in("id", ids) : { data: [] };
  const lead = id => (people || []).find(x => x.id === id);
  box.innerHTML = `<table><tr><th>School</th><th>Registered by</th><th>Code</th><th>Status</th><th>Modules</th></tr>
    ${schools.map(s => { const l = lead(s.created_by), on = s.modules || []; return `<tr>
      <td><b>${esc(s.name)}</b><br><span class="note">${esc(s.country)}</span></td>
      <td>${esc(l ? (l.full_name || "") : "")}<br><span class="note">${esc(l ? l.email : "")}</span></td>
      <td>${esc(s.join_code)}</td>
      <td><span class="badge b-${esc(s.status)}">${esc(s.status[0].toUpperCase() + s.status.slice(1))}</span>
        <div class="row" style="margin-top:8px">${s.status !== "approved" ? `<button class="btn small" data-s="${s.id}" data-st="approved">Approve</button>` : ""}
        ${s.status !== "suspended" ? `<button class="btn ghost small" data-s="${s.id}" data-st="suspended">Suspend</button>` : ""}</div></td>
      <td><div class="mods">${MODULES.map(m => `<label><input type="checkbox" data-school="${s.id}" value="${m.id}" ${on.includes(m.id) ? "checked" : ""}>${esc(m.name)}</label>`).join("")}</div>
        <span class="note" id="mm-${s.id}"></span></td></tr>`; }).join("")}</table>`;
  box.querySelectorAll("[data-s]").forEach(b => b.onclick = () => busy(b, async () => {
    if (b.dataset.st === "suspended" && !confirm("Suspend this school? Its members will lose access until you approve it again.")) return;
    const { error } = await sb.rpc("set_school_status", { p_school: b.dataset.s, p_status: b.dataset.st });
    if (error) return alert(friendly(error)); adminView(); }));
  box.querySelectorAll("[data-school]").forEach(c => c.onchange = async () => {
    const id = c.dataset.school, note = document.getElementById("mm-" + id);
    const mods = [...box.querySelectorAll(`[data-school="${id}"]:checked`)].map(x => x.value);
    note.textContent = "Saving…";
    const { error } = await sb.rpc("set_school_modules", { p_school: id, p_modules: mods });
    note.textContent = error ? "Not saved: " + friendly(error) : "Saved";
    if (error) c.checked = !c.checked;
  });
}

async function render(){
  if (recovering) return resetView();
  const { data: { session } } = await sb.auth.getSession();
  if (!session) return authView();
  const { data: p, error } = await sb.from("profiles").select("*").eq("id", session.user.id).single();
  if (error || !p) { app.innerHTML = `<div class="card"><div class="msg err">We couldn’t load your account. Please sign out and try again.</div></div>`; return; }
  header(p);
  if (p.platform_admin) return adminView();
  if (!p.school_id) return chooseView(p);
  const { data: school } = await sb.from("schools").select("*").eq("id", p.school_id).single();
  if (!school) return waitView("Almost there", "We couldn’t find your school. Please get in touch with us.");
  if (school.status === "pending") return waitView(`${school.name} is waiting for approval`, "We’ll review your school soon. You’ll be able to set it up as soon as it’s approved.");
  if (school.status === "suspended") return waitView("Access paused", `${school.name}’s access is paused. Please get in touch with us.`);
  if (!p.active) return waitView("Waiting for your school leader", `You’ve joined ${school.name}. Your school leader needs to approve your account before you can start.`);
  homeView(p, school);
}

sb.auth.onAuthStateChange(event => {
  if (event === "PASSWORD_RECOVERY") { recovering = true; resetView(); return; }
  if (event === "SIGNED_IN" || event === "SIGNED_OUT") setTimeout(render, 0);
});
render();
</script>
</body>
</html>
