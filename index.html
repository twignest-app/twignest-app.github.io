  const { data: st } = await sb.from("students").select("id,class_id").in("class_id", cls.map(c => c.id)).eq("archived", false);
  const gname = id => (grades.find(g => g.id === id) || {}).name || "Other", count = id => (st || []).filter(s => s.class_id === id).length;
  const btn = (c, key) => `<button class="colcard classbtn" data-open="${key}" style="margin:0;text-align:left;cursor:pointer;font:inherit;color:inherit"><b style="font-family:Poppins,sans-serif;font-size:18px;color:var(--plum)">${esc(c.name)}</b><div class="note">${esc(gname(c.grade_id))}, ${count(c.id)} student${count(c.id) === 1 ? "" : "s"}</div></button>`;
  const groups = [];
  if (!teacherId) groups.push({ title: role === "checker" ? "Report comments to check" : "Class sheets", note: role === "checker" ? "Choose a class to check its report comments." : "Choose a class to open its sheet.", list: cls, subjects: null });
  else {
    const home = cls.filter(c => links.some(l => l.class_id === c.id && !l.subject_id));
    if (home.length) groups.push({ title: "My classes", note: "Choose a class to open its sheet.", list: home, subjects: null });
    [...new Set(links.filter(l => l.subject_id).map(l => l.subject_id))].forEach(sid => { const sb2 = subjects.find(x => x.id === sid); if (!sb2) return;
      groups.push({ title: `My ${sb2.name} classes`, note: `You see only ${sb2.name} in these classes. Use the class name at the top of the sheet to switch quickly between classes.`, list: cls.filter(c => links.some(l => l.class_id === c.id && l.subject_id === sid)), subjects: [sid] }); });
  }
  const top = opts.head ? pageHead(teacherId ? "My classes" : role === "checker" ? "Reports to check" : "Class sheets", esc(year)) : "";
  el.innerHTML = top + groups.map((g, gi) => `<div class="card"><h2>${esc(g.title)}</h2><p class="note">${g.note}</p><div class="grid2" style="margin-top:12px">${g.list.map(c => btn(c, gi + "|" + c.id)).join("")}</div></div>`).join("");
  el.querySelectorAll("[data-open]").forEach(b => b.onclick = () => { const [gi, id] = b.dataset.open.split("|"), g = groups[+gi], c = g.list.find(x => x.id === id);
    const host = opts.head ? el : app;
    TNSheet.open({ sb, cls: c, el: host, role, subjects: g.subjects, siblings: g.list, schoolName: school.name, gradeName: gname(c.grade_id), crumb: opts.head ? (teacherId ? "My classes" : role === "checker" ? "Reports to check" : "Class sheets") : "Home",
      back: () => { TNSheet.close(); if (opts.head) classList(school, teacherId, el, role, opts); else render(); } }); });
}

sb.auth.onAuthStateChange((event) => {
  if (event === "PASSWORD_RECOVERY") { recovering = true; resetView(); return; }
  if (event === "SIGNED_IN" || event === "SIGNED_OUT") setTimeout(render, 0);
});
render();
</script>
